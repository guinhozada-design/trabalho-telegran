<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Web — Login (Clone acadêmico)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar__logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="white">
        <path d="M21.5 3.5 2.6 10.9c-1.2.5-1.2 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.2-2.1 4.6 3.4c.8.5 1.4.2 1.6-.7l3-14.1c.3-1.2-.4-1.7-1.7-1.3zM8.6 13.6l9.3-5.9c.4-.3.8-.1.5.2l-7.9 7.2-.3 3.2-1.6-4.7z"/>
      </svg>
    </div>
    <p class="topbar__title">Telegram Web</p>
    <nav class="topbar__lang" aria-label="Selecionar idioma">
      <button type="button" class="lang-btn" data-lang="pt">PT</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="ru">RU</button>
    </nav>
  </header>

  <main class="login-wrap">

    <section id="phone-screen" class="login-card" aria-labelledby="phone-title">
      <div class="login-card__single">

        <div class="phone-info__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="48" height="48">
            <circle cx="12" cy="12" r="12" fill="#54a9eb"/>
            <path d="M17.5 6.5 6.6 10.9c-.8.3-.8.8-.1 1l3.2 1 1.2 3.7c.1.4.3.5.6.5.3 0 .4-.1.6-.3l1.5-1.4 3.1 2.3c.5.3.9.1 1.1-.5l2-9.3c.2-.8-.3-1.1-1.1-.9z" fill="white"/>
          </svg>
        </div>

        <h1 id="phone-title" class="phone-info__title">Entrar no Telegram</h1>
        <p class="phone-info__subtitle">Confirme o código do seu país e digite seu número de telefone.</p>

        <form class="phone-form" novalidate>
          <div class="field">
            <label for="country">País</label>
            <select id="country" name="country">
              <option value="br" selected>Brasil</option>
              <option value="pt">Portugal</option>
              <option value="us">Estados Unidos</option>
              <option value="ar">Argentina</option>
            </select>
          </div>

          <div class="field field--phone">
            <label for="phone">Número de telefone</label>
            <div class="field__phone-group">
              <span class="field__prefix" aria-hidden="true">+55</span>
              <input type="tel" id="phone" name="phone" placeholder="00 00000-0000" autocomplete="tel" required>
            </div>
          </div>

          <div class="field field--checkbox">
            <input type="checkbox" id="keep-signed" name="keep-signed" checked>
            <label for="keep-signed">Manter-me conectado</label>
          </div>

          <button type="submit" class="btn btn--primary btn--block">Próximo</button>
        </form>

      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>
      Projeto acadêmico — clone de estudo da tela de login do Telegram Web,
      desenvolvido por <strong>Marco Antonio Pasinato</strong> para a disciplina de Front-End (Atitus).
      Não possui vínculo oficial com o Telegram.
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>a
